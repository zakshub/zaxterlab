<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZaxterLab — AI Company Operating System</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (Offline-safe CDN with local fallback) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg-page: #f4f6fa;
        --bg-sidebar: #0b1326;
        --bg-sidebar-active: #17233d;
        --bg-card: #ffffff;
        --bg-dark-card: #0d1629;
        --border-subtle: #e2e8f0;
        --border-sidebar: #172442;
        --accent-lime: #b4f53c;
        --accent-lime-hover: #a1e828;
        --accent-lime-text: #0b1326;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --text-sidebar: #94a3b8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-page);
        color: var(--text-primary);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(241, 245, 249, 0.8);
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body class="bg-[#f4f6fa] text-slate-900 antialiased overflow-hidden selection:bg-lime-400 selection:text-slate-950">
    <div id="root"></div>

    <!-- Application Script Entry -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
