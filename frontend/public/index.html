<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZaxterLab — Immersive Intelligence World & AI Company OS</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (Offline-safe CDN with local fallback) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ZaxterLab Light-Mode Immersive Design System Tokens -->
    <link rel="stylesheet" href="./design-tokens.css" />
    <style>
      :root {
        --bg-page: #FBF9F5;
        --bg-sidebar: #F4F1EA;
        --bg-sidebar-active: #FFFFFF;
        --bg-card: #FFFFFF;
        --border-subtle: #E6E1D6;
        --border-sidebar: #DFD9CC;
        --accent-blue: #0B6BCB;
        --accent-emerald: #15803D;
        --text-primary: #141923;
        --text-secondary: #3E4C59;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-page);
        color: var(--text-primary);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(244, 241, 234, 0.8);
      }
      ::-webkit-scrollbar-thumb {
        background: #CBC4B5;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9E9686;
      }
    </style>
  </head>
  <body class="bg-[#FBF9F5] text-[#141923] antialiased overflow-hidden selection:bg-sky-200 selection:text-slate-950">
    <div id="root"></div>

    <!-- Application Script Entry -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
